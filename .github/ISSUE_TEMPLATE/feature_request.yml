name: Feature request
description: Suggest an improvement or a new provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first; the solution can follow.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: For a new provider, link to where its usage limits can be read.
