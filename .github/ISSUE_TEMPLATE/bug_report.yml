name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ai-usage-bot version`, or the commit.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [macOS (launchd), Linux (systemd), Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ai-usage-bot doctor`
      description: Shows which data source fails. It contains no secrets, but check it before pasting.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log lines around the problem. **Remove the bot token and chat IDs.**
      render: text
